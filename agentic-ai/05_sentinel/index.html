<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>microsoft/vscode issues</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <header class="masthead">
      <p class="eyebrow">microsoft / vscode</p>
      <h1>Issues</h1>
      <div class="toolbar" aria-label="Issue controls">
        <label class="search-box">
          <span>Rechercher</span>
          <input id="search" type="search" placeholder="Titre, auteur, label..." autocomplete="off">
        </label>
      </div>
    </header>
    <section id="issues" class="issue-grid" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
